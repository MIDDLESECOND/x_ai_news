# 覆盖矩阵只描述“是否有直接源”，不把聚合器或 OpenRouter 当成厂商直接覆盖。
coverage:
  surfaces: [release, pricing, degradation, company]
  # 与正式 topics.yaml:model_keywords 对账；新增模型族却未补覆盖对象时，审计入口直接报错。
  target_aliases:
    OpenAI: [Luna, GPT-5.6]
    Anthropic: [Claude]
    DeepSeek: [DeepSeek, V4-Flash, V4 Flash]
    Z.ai: [GLM]
    xAI: [Grok]
    Kimi: [Kimi, K3]
    Qwen: [Qwen]
    Gemini: []
    Meta / Llama: [Llama]
  targets:
    OpenAI:
      release: {incumbent: [openai_blog]}
      pricing: {incumbent: [openai_pricing]}
      degradation: {incumbent: [status_openai, codexradar]}
      company: {incumbent: [openai_blog]}
    Anthropic:
      release: {incumbent: [anthropic_blog, anthropic_engineering]}
      pricing: {incumbent: [anthropic_pricing]}
      degradation: {incumbent: [status_anthropic]}
      company: {incumbent: [anthropic_blog]}
    DeepSeek:
      release: {incumbent: [hf_deepseek, deepseek_github], trial: [trial_deepseek_updates]}
      pricing: {incumbent: [deepseek_pricing]}
      degradation: {trial: [trial_deepseek_status]}
      company: {gap: '未发现独立官方新闻/公司公告 feed；GitHub 仅算工程发布', manual: '官网、透明度页与官方社媒需人工复核'}
    Z.ai:
      release: {incumbent: [hf_zai, zai_blog]}
      pricing: {incumbent: [zhipu_pricing]}
      degradation: {gap: '未验证到公开 incident feed', manual: 'open.bigmodel.cn/status 在 Chrome 中仅显示应用壳'}
      company: {incumbent: [zai_blog, hk_02513]}
    xAI:
      release: {incumbent: [xai_blog]}
      pricing: {trial: [trial_xai_pricing]}
      degradation: {trial: [trial_xai_status]}
      company: {incumbent: [xai_blog]}
    Kimi:
      release: {incumbent: [hf_moonshot], trial: [trial_kimi_blog]}
      pricing: {trial: [trial_kimi_pricing]}
      degradation: {trial: [trial_kimi_status]}
      company: {trial: [trial_kimi_blog]}
    Qwen:
      release: {incumbent: [hf_qwen], trial: [trial_qwen_blog], manual: '新 qwen.ai 研究页浏览器可读但未发现 feed'}
      pricing: {trial: [trial_qwen_pricing]}
      degradation: {gap: '阿里云健康页含 Platform for AI，但未验证到 Qwen/Model Studio 专属 feed', manual: 'status.alibabacloud.com 可浏览器复核'}
      company: {trial: [trial_qwen_blog], gap: '旧博客 RSS 是否继续更新待审计；新站无已发现 feed'}
    Gemini:
      release: {trial: [trial_deepmind_blog, trial_google_ai_blog]}
      pricing: {trial: [trial_gemini_pricing]}
      degradation: {trial: [trial_gemini_status], manual: 'Chrome 可读完整事故历史；匿名 HTML 探针仍只得到页面壳'}
      company: {trial: [trial_deepmind_blog, trial_google_ai_blog]}
    Meta / Llama:
      release: {trial: [trial_meta_llama_hf, trial_meta_ai_blog]}
      pricing: {not_applicable: 'Meta 不提供 Llama 第一方托管 API 牌价'}
      degradation: {not_applicable: '无第一方托管推理服务状态面'}
      company: {trial: [trial_meta_ai_blog]}
