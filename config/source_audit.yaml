# 非 Reddit 分区的通用影子审计。
# 候选源不会进入 data/raw 或日报；只写 data/source_audit 与私有 reports/source-audit。

audit:
  duration_days: 14
  keep_days: 21
  request_delay_seconds: 2
  signal_match_window_days: 30
  # 只扩展影子审计的召回，不修改正式 topics.yaml 或日报范围。
  discovery_keywords: [Gemini, Google DeepMind, Google AI Studio]

partitions:
  release:
    section: 今日发布
    label: 发布
    profile: release
  field_test:
    section: 一线实测
    label: 实测
    profile: field_test
  research_synthesis:
    section: 技术综述/研究解读
    label: 技术综述/研究解读
    profile: research_synthesis
    shadow_only: true
  pricing:
    section: 定价与额度变动
    label: 定价/额度
    profile: pricing
  degradation:
    section: 降智观察
    label: 降智/事故
    profile: degradation
  company:
    section: 公司动态
    label: 公司动态
    profile: company

