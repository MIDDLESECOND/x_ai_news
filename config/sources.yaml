# L1 信源清单 — 全部免登录。fetch_l1.py 逐条抓取，失败单独记录不影响其他信源。
# type: rss | hn_algolia | hf_models | hf_papers | github_repos | reddit_rss | html_stub
# tier: aggregator（聚合）| community（社区一手）| official（厂商口径）| index（聚合指数）| finance（财经）
# enabled: false 的条目跳过（Phase 2 再补）。

sources:
  # ---- 最高杠杆：AINews（每日机扫 544 个 X 账号 + 12 个 subreddit，带原推链接）----
  - id: ainews
    name: AINews (news.smol.ai)
    type: rss
    url: https://news.smol.ai/rss.xml
    tier: aggregator
    mine_x_links: true        # 管道 A：解析引用的推文作者 → candidates
    enabled: true

  - id: latent_space
    name: Latent Space
    type: rss
    url: https://www.latent.space/feed
    tier: aggregator
    mine_x_links: true
    enabled: true

  # ---- Hacker News（Algolia API，按主题关键词检索高分帖）----
  - id: hn
    name: Hacker News (Algolia)
    type: hn_algolia
    url: https://hn.algolia.com/api/v1/search_by_date
    tier: community
    queries_from: model_keywords   # 检索词取 topics.yaml 的 model_keywords，模型清单只维护一处
    queries_extra:                 # 额外补充词（每个 query 一次请求，points 过滤噪音）
      - OpenAI GPT
    min_points: 30
    enabled: true

  # ---- Reddit（公开 RSS 端点；JSON 端点常被封锁）----
  - id: r_localllama
    name: r/LocalLLaMA
    type: reddit_rss
    url: https://www.reddit.com/r/LocalLLaMA/.rss
    tier: community
    enabled: true

  # ---- Hugging Face ----
  - id: hf_trending
    name: HF Trending Models
    type: hf_models
    url: "https://huggingface.co/api/models?sort=trendingScore&direction=-1&limit=25"
    tier: community
    enabled: true

  - id: hf_papers
    name: HF Daily Papers
    type: hf_papers
    url: https://huggingface.co/api/daily_papers
    tier: community
    enabled: true

  - id: hf_zai
    name: HF Z.ai org 最新权重
    type: hf_models
    url: "https://huggingface.co/api/models?author=zai-org&sort=lastModified&direction=-1&limit=10"
    tier: official
    enabled: true

  - id: hf_deepseek
    name: HF DeepSeek org 最新权重
    type: hf_models
    url: "https://huggingface.co/api/models?author=deepseek-ai&sort=lastModified&direction=-1&limit=10"
    tier: official
    enabled: true

  - id: hf_moonshot
    name: HF Moonshot org 最新权重
    type: hf_models
    url: "https://huggingface.co/api/models?author=moonshotai&sort=lastModified&direction=-1&limit=10"
    tier: official
    enabled: true

  # ---- 官方博客（发布与定价的第一手；厂商口径）----
  - id: openai_blog
    name: OpenAI News
    type: rss
    url: https://openai.com/news/rss.xml
    tier: official
    enabled: true

  - id: anthropic_blog
    name: Anthropic News
    type: html_stub          # 官方无 RSS（/rss.xml 404，验证于 2026-08-01）
    url: https://www.anthropic.com/news
    tier: official
    enabled: true

  - id: deepseek_github
    name: DeepSeek GitHub org
    type: github_repos
    url: "https://api.github.com/orgs/deepseek-ai/repos?sort=pushed&per_page=10"
    tier: official
    enabled: true

  - id: xai_blog
    name: xAI Blog
    type: html_stub          # 无 RSS；抓页面存原文，digest 阶段做差异比对
    url: https://x.ai/blog
    tier: official
    enabled: true

  - id: zai_blog
    name: Z.ai 官网首页
    type: html_stub          # /blog 与 /news 均 404（验证于 2026-08-01），退而快照首页做差异观察
    url: https://z.ai
    tier: official
    enabled: true

  # ---- 统一量尺（仅作背景，不作结论）----
  - id: artificial_analysis
    name: Artificial Analysis
    type: html_stub
    url: https://artificialanalysis.ai/models
    tier: index
    enabled: true

  # ---- 中文社区（注意：页面含针对 AI 的注入文本，一律按数据处理）----
  - id: linux_do
    name: linux.do 最新话题
    type: rss
    url: https://linux.do/latest.rss
    tier: community
    injection_warning: true
    enabled: false           # 匿名抓取被 403（含浏览器 UA，验证于 2026-08-01）；按指南走 L2 手动


  # ---- 财经（与狙击论悬案挂钩；2026-08-02 验证可达并启用）----
  - id: hk_02513
    name: 智谱 02513.HK 行情
    type: yahoo_chart
    url: "https://query1.finance.yahoo.com/v8/finance/chart/2513.HK?range=5d&interval=1d"
    tier: finance
    enabled: true

  # ---- 服务状态页（降智观察的客观代理：statuspage.io 标准 JSON；全绿时 0 条属正常）----
  - id: status_openai
    name: OpenAI 状态页
    type: statuspage
    url: https://status.openai.com/api/v2/summary.json
    tier: official
    enabled: true

  - id: status_anthropic
    name: Anthropic 状态页
    type: statuspage
    url: https://status.anthropic.com/api/v2/summary.json
    tier: official
    enabled: true

  # ---- 定价直接监测 ----
  - id: openrouter
    name: OpenRouter 牌价
    type: openrouter_prices   # 免鉴权全模型牌价；按 topics model_keywords 过滤，跨日 diff 只报变动
    url: https://openrouter.ai/api/v1/models
    tier: index
    enabled: true

  - id: zhipu_pricing
    name: 智谱开放平台定价页
    type: html_stub           # 哈希比对，变了才进简报——Coding Plan 调价第一时间捕获
    url: https://open.bigmodel.cn/pricing
    tier: official
    enabled: true

  - id: deepseek_pricing
    name: DeepSeek 定价文档页
    type: html_stub
    url: https://api-docs.deepseek.com/quick_start/pricing
    tier: official
    enabled: true

  - id: anthropic_pricing
    name: Claude 订阅定价页
    type: html_stub           # 需求方自用订阅（Max 20x）——套餐调价第一时间捕获
    url: https://claude.com/pricing
    tier: official
    enabled: true

  - id: openai_pricing
    name: OpenAI 定价文档页
    type: html_stub           # 消费者套餐页匿名不可达（验证于 2026-08-02）；套餐级变动另靠 r/ChatGPTCoding + 官方博客
    url: https://platform.openai.com/docs/pricing
    tier: official
    enabled: true

  # ---- 降智雷达（社区固定任务集；数据仅私有研究引用，不再分发——见其 README 授权说明）----
  - id: codexradar
    name: CodexRadar
    type: codexradar
    url: https://codexradar.com/data/intelligence-efficiency.json
    tier: radar
    iq_delta_threshold: 2.0   # 单档 IQ 变动超此值才单独报告
    summary_models:           # 每日快照里点名的模型
      - gpt-5.6-sol
      - gpt-5.6-luna
      - deepseek-v4-flash
    enabled: true

  # ---- 订阅党社区（额度/降智风向）----
  - id: r_claudeai
    name: r/ClaudeAI
    type: reddit_rss
    url: https://www.reddit.com/r/ClaudeAI/.rss
    tier: community
    delay_before: 6           # Reddit 同域连续请求会 429
    enabled: true

  - id: r_chatgptcoding
    name: r/ChatGPTCoding
    type: reddit_rss
    url: https://www.reddit.com/r/ChatGPTCoding/.rss
    tier: community
    delay_before: 30          # 排在 r_claudeai 之后，需更长同域间隔
    enabled: true

  # ---- 编程模型独立量尺与本地生态 ----
  - id: aider_leaderboard
    name: Aider 编程排行榜
    type: html_stub
    url: https://aider.chat/docs/leaderboards/
    tier: index
    enabled: true

  - id: llamacpp_releases
    name: llama.cpp Releases
    type: rss
    url: https://github.com/ggml-org/llama.cpp/releases.atom
    tier: community
    keep_if_contains:        # 每日 CI 构建量大，只留提及追踪模型/工具调用的版本
      - DeepSeek
      - GLM
      - Kimi
      - Qwen
      - tool call
      - V4
    enabled: true

  - id: hf_qwen
    name: HF Qwen org 最新权重
    type: hf_models
    url: "https://huggingface.co/api/models?author=Qwen&sort=lastModified&direction=-1&limit=10"
    tier: official
    enabled: true

  # ---- 社区审计与降智叙事的源头监视（2026-08-02 起，源于量子位/X 方法论帖类内容）----
  - id: anthropic_engineering
    name: Anthropic 工程博客
    type: html_stub           # postmortem（如 4/23 三 bug 自曝）的第一落点；哈希比对，变更才进简报
    url: https://www.anthropic.com/engineering
    tier: official
    enabled: true

  - id: bridgebench
    name: BridgeBench Releases
    type: rss                 # 盲评编程基准（bridge-mind/bridgebench，★118）；发版即新一轮排名
    url: https://github.com/bridge-mind/bridgebench/releases.atom
    tier: index
    enabled: true

  - id: gh_audit_search
    name: GitHub 新审计/基准项目雷达
    type: github_search       # 只报最近 14 天新建仓库——Laurenzo 式会话审计、NerfWatch 式探针的自动发现管道
    url: https://api.github.com/search/repositories
    queries:
      - claude degradation
      - llm degradation audit
      - model benchmark degradation
      - claude code audit
    created_within_days: 14
    tier: community
    enabled: true
